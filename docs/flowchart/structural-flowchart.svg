<text x="20" y="30" font-size="18" font-weight="700" fill="#12303a">Structural Flowchart — Zero Incident (Safety Training Simulator)</text>
<text x="20" y="48" font-size="11.5" fill="#5a7680">Complete program flow: login → validation → session → role split → 3D hub → module → quiz → result → certificate</text>
